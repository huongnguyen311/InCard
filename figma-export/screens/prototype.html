  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    :root {
      --green: #009037;
      --green-light: #2eb07a;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-200: #e2e8f0;
      --white: #ffffff;
      --line: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Public Sans', sans-serif;
      background: var(--slate-900);
      color: var(--slate-200);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .side {
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: rgba(15,23,42,0.6);
    }
    .side-head { padding: 20px 20px 12px; border-bottom: 1px solid var(--line); }
    .side-head h1 { font-size: 18px; font-weight: 800; color: var(--white); }
    .side-head p { font-size: 12px; color: var(--slate-400); margin-top: 4px; line-height: 1.5; }
    .side-head a { color: var(--green-light); text-decoration: none; }
    .search {
      margin-top: 12px; width: 100%; height: 36px; border-radius: 10px;
      border: 1px solid var(--line); background: rgba(255,255,255,0.05);
      color: var(--white); padding: 0 12px; font: inherit; font-size: 13px;
    }
    .search:focus { outline: 2px solid rgba(0,144,55,0.5); }
    .list { overflow-y: auto; padding: 8px 10px 24px; flex: 1; }
    .group { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--slate-500); padding: 14px 10px 6px; }
    .item {
      display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left;
      background: none; border: 0; color: var(--slate-400); font: inherit; font-size: 13px;
      padding: 6px 10px; border-radius: 8px; cursor: pointer;
    }
    .item:hover { background: rgba(255,255,255,0.05); color: var(--white); }
    .item.active { background: rgba(0,144,55,0.18); color: var(--white); }
    .item .no { font-size: 11px; color: var(--slate-500); min-width: 22px; }
    .item.flow::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green-light);
      margin-left: auto; align-self: center; flex-shrink: 0; }

    /* ── Stage ── */
    .stage { display: flex; flex-direction: column; align-items: center; height: 100%; overflow: auto; padding: 16px; }
    .bar {
      display: flex; align-items: center; gap: 8px; width: 100%; max-width: 560px;
      margin-bottom: 14px; flex-wrap: wrap; justify-content: center;
    }
    .bar button {
      height: 34px; padding: 0 14px; border-radius: 9999px; border: 1px solid var(--line);
      background: rgba(255,255,255,0.06); color: var(--slate-200); font: inherit; font-size: 13px;
      font-weight: 600; cursor: pointer;
    }
    .bar button:hover { background: rgba(255,255,255,0.12); }
    .bar button.on { background: var(--green); border-color: var(--green); color: var(--white); }
    .crumb { font-size: 13px; color: var(--slate-400); flex-basis: 100%; text-align: center; }
    .crumb b { color: var(--white); font-weight: 700; }

    .phone {
      width: 398px; height: 852px; flex-shrink: 0; border-radius: 48px; padding: 4px;
      background: #000; box-shadow: 0 0 0 1px #334155, 0 30px 80px rgba(0,0,0,0.6);
      position: relative;
    }
    .phone iframe {
      width: 390px; height: 844px; border: 0; border-radius: 44px; display: block; background: var(--white);
    }
    .island {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 30px; border-radius: 20px; background: #000; z-index: 2; pointer-events: none;
    }
    .hint { font-size: 12px; color: var(--slate-500); margin-top: 12px; text-align: center; }

    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; overflow: auto; }
      .side { display: none; }
      .stage { padding: 12px 0; }
      .phone { transform-origin: top center; }
    }
  </style>
</head>

  'profile/18-import-linkedin': [['Extract', 'profile/20-extracting-linkedin'], ['Cancel', 'back']],
  'profile/19-import-options': [['.linkedin-card', 'profile/18-import-linkedin'], ['.option-card', 'profile/12-edit-profile']],
};

/* Screens that advance on their own */
const AUTO = {
  'auth/00-splash': ['auth/02-sign-in', 1800],
  'home/05-syncing-database': ['network/09-contacts', 2500],
  'profile/20-extracting-linkedin': ['profile/12-edit-profile', 2500],
};

/* ───────────────────────── Engine ───────────────────────── */
const frame = document.getElementById('frame');
const START = 'auth/00-splash';
let current = null, stack = [], autoTimer = null, alwaysHs = false;

const norm = s => (s || '').replace(/\s+/g, ' ').trim();
const isCss = m => /^[.#\[]|^[a-z]+[.#\[]|^body$/.test(m);

function rulesFor(id) {
  const own = ROUTES[id] || [];
  const nav = (id.startsWith('auth/') ? [] : NAV);
  return [...own, ...nav, ...BACK];
}

/* Does element `el` satisfy matcher `m`? */
function matches(el, m, doc) {
  if (!el || el.nodeType !== 1) return false;
  let scope = null, text = m;
  const pref = m.match(/^(nav|tab|toggle):(.*)$/);
  if (pref) { scope = pref[1]; text = pref[2]; }
  if (!pref && isCss(m)) {
    const [sel, idx] = m.split('@');
    try {
      if (!el.matches(sel)) return false;
      if (idx === undefined) return true;
      return [...doc.querySelectorAll(sel)].indexOf(el) === +idx;
    } catch (e) { return false; }
  }
  if (scope === 'nav' && !el.closest('.bottom-nav, .ds-bottom-nav')) return false;
  if (scope === 'tab' && !el.closest('.tabs, .section-tabs, .ds-tabs, .tab, [class*="tab"]')) return false;
  if (scope === 'toggle' && !el.closest('.toggle-btn, [class*="toggle"]')) return false;
  const star = text.endsWith('*');
  const want = star ? text.slice(0, -1) : text;
  const got = norm(el.textContent);
  const aria = norm(el.getAttribute('aria-label'));
  if (aria === want) return true;
  return star ? got.startsWith(want) && got.length < want.length + 60 : got === want;
}

function findRoute(target, doc) {
  const rules = rulesFor(current);
  for (let el = target; el && el !== doc.documentElement; el = el.parentElement) {
    for (const [m, to] of rules) if (matches(el, m, doc)) return to;
    if (el === doc.body) break;
  }
  return null;
}

/* All elements that would navigate — used for hotspot flashing */
function hotspots(doc) {
  const out = new Set();
  const all = doc.body ? doc.body.querySelectorAll('*') : [];
  for (const [m] of rulesFor(current)) {
    if (m === 'body') continue;
    for (const el of all) {
      if (!matches(el, m, doc)) continue;
      // keep the outermost match so the highlight covers the whole control
      let top = el;
      while (top.parentElement && top.parentElement !== doc.body && matches(top.parentElement, m, doc)) top = top.parentElement;
      out.add(top);
    }
  }
  return [...out].filter(el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; });
}

function flash(doc, keep) {
  doc.querySelectorAll('.__hs').forEach(e => e.classList.remove('__hs'));
  hotspots(doc).forEach(e => e.classList.add('__hs'));
  if (!keep) setTimeout(() => doc.querySelectorAll('.__hs').forEach(e => e.classList.remove('__hs')), 700);
}

function go(id, push = true) {
  if (id === 'back') return back();
  if (!id) return;
  if (push && current && current !== id) stack.push(current);
  current = id;
  frame.src = id + '.html';
  location.hash = id;
  render();
}
function back() {
  if (stack.length) { current = stack.pop(); frame.src = current + '.html'; location.hash = current; render(); }
  else go(T.HOME, false);
}

frame.addEventListener('load', () => {
  clearTimeout(autoTimer);
  const doc = frame.contentDocument;
  if (!doc) return;
  const st = doc.createElement('style');
  st.textContent = `
    .screen { border-radius: 0 !important; }
    html, body { scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; }
    .__hs { outline: 2px solid rgba(46,176,122,.95) !important; outline-offset: 1px;
      background-color: rgba(46,176,122,.18) !important; transition: none !important; }
    [data-proto] { cursor: pointer; }`;
  doc.head.appendChild(st);
  doc.addEventListener('click', e => {
    const to = findRoute(e.target, doc);
    if (to) {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      go(to);
      return;
    }
    // Let the page's own controls work (tabs, sheets, toggles); otherwise show hotspots
    const interactive = e.target.closest('button, a, input, textarea, select, label, [onclick], [role="button"]');
    if (!interactive) flash(doc);
    if (e.target.closest('a[href]')) e.preventDefault();
  }, true);
  if (alwaysHs) flash(doc, true);
  const auto = AUTO[current];
  if (auto) autoTimer = setTimeout(() => go(auto[0]), auto[1]);
});

/* ───────────────────────── Sidebar & controls ───────────────────────── */
const list = document.getElementById('list');
const label = id => id.split('/')[1].replace(/^[\w]+?-/, m => m).replace(/-/g, ' ');
function buildList(q = '') {
  list.innerHTML = '';
  q = q.toLowerCase();
  for (const [g, items] of Object.entries(GROUPS)) {
    const hits = items.filter(s => !q || (g + '/' + s).toLowerCase().includes(q));
    if (!hits.length) continue;
    const h = document.createElement('div'); h.className = 'group'; h.textContent = GROUP_LABEL[g]; list.appendChild(h);
    for (const s of hits) {
      const id = g + '/' + s;
      const b = document.createElement('button');
      b.className = 'item' + (ROUTES[id] || AUTO[id] ? ' flow' : '');
      b.dataset.id = id;
      const [no, ...rest] = s.split('-');
      b.innerHTML = `<span class="no">${no}</span><span>${rest.join(' ')}</span>`;
      b.title = id;
      b.onclick = () => go(id);
      list.appendChild(b);
    }
  }
  render();
}
function render() {
  list.querySelectorAll('.item').forEach(b => b.classList.toggle('active', b.dataset.id === current));
  const act = list.querySelector('.item.active');
  if (act) act.scrollIntoView({ block: 'nearest' });
}
function toggleHs() {
  alwaysHs = !alwaysHs;
  const doc = frame.contentDocument;
  if (doc) alwaysHs ? flash(doc, true) : doc.querySelectorAll('.__hs').forEach(e => e.classList.remove('__hs'));
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); back(); }
  if (e.key === 'h' || e.key === 'H') toggleHs();
  if (e.key === 'r' || e.key === 'R') { stack = []; go(START, false); }
});

/* Scale phone down on short viewports */
function fit() {
  const phone = document.getElementById('phone');
  const avail = window.innerHeight - 70;
  const s = Math.min(1, avail / 852, (window.innerWidth - 24) / 398);
  phone.style.transform = s < 1 ? `scale(${s})` : '';
  phone.style.transformOrigin = 'top center';
  phone.style.marginBottom = s < 1 ? `${-(852 * (1 - s))}px` : '';
}
window.addEventListener('resize', fit);
fit();

buildList();
const fromHash = decodeURIComponent(location.hash.slice(1));
go(fromHash && fromHash.includes('/') ? fromHash : START, false);
</script>
</body>
</html>
